{% extends "base.html" %}

{% block title %}Edit Transaction #{{ transaction.id }} | Personal Expense Tracker{% endblock %}
{% block page_title %}Edit Transaction #{{ transaction.id }}{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 0 auto;">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
                Update Transaction Record
            </h2>
            <a href="{{ url_for('transactions_list') }}" class="btn btn-outline btn-sm">Back to History</a>
        </div>

        <div class="card-body">
            <form action="{{ url_for('edit_transaction', tx_id=transaction.id) }}" method="POST" id="editTransactionForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- Type Selector -->
                <div class="form-group">
                    <label class="form-label">Transaction Type <span style="color:var(--danger)">*</span></label>
                    <div class="type-toggle-group">
                        <div class="type-toggle-item">
                            <input type="radio" id="typeExpense" name="transaction_type" value="Expense" 
                                   {% if (form_data.transaction_type or transaction.transaction_type) == 'Expense' %}checked{% endif %}>
                            <label for="typeExpense" class="type-toggle-label expense-btn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <polyline points="19 12 12 19 5 12"></polyline>
                                </svg>
                                Expense
                            </label>
                        </div>
                        <div class="type-toggle-item">
                            <input type="radio" id="typeIncome" name="transaction_type" value="Income" 
                                   {% if (form_data.transaction_type or transaction.transaction_type) == 'Income' %}checked{% endif %}>
                            <label for="typeIncome" class="type-toggle-label income-btn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="12" y1="19" x2="12" y2="5"></line>
                                    <polyline points="5 12 12 5 19 12"></polyline>
                                </svg>
                                Income
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Date & Amount -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="transaction_date" class="form-label">Date <span style="color:var(--danger)">*</span></label>
                        <input type="date" id="transaction_date" name="transaction_date" class="form-control" 
                               value="{{ form_data.transaction_date or transaction.transaction_date }}" required>
                    </div>

                    <div class="form-group">
                        <label for="amount" class="form-label">Amount ({{ currency_symbol }}) <span style="color:var(--danger)">*</span></label>
                        <input type="number" id="amount" name="amount" class="form-control" 
                               step="0.01" min="0.01" 
                               value="{{ form_data.amount if form_data.amount is string else (form_data.amount or transaction.amount) | to_decimal_str }}" required>
                    </div>
                </div>

                <!-- Category & Payment Method -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="categorySelect" class="form-label">Category <span style="color:var(--danger)">*</span></label>
                        <select id="categorySelect" name="category" class="form-control" 
                                data-selected="{{ form_data.category or transaction.category }}" required>
                            <!-- Dynamically maintained by main.js based on selected type -->
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="payment_method" class="form-label">Payment Method <span style="color:var(--danger)">*</span></label>
                        <select id="payment_method" name="payment_method" class="form-control" required>
                            {% for method in payment_methods %}
                                <option value="{{ method }}" {% if (form_data.payment_method or transaction.payment_method) == method %}selected{% endif %}>
                                    {{ method }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="description" class="form-label">Description / Note</label>
                    <input type="text" id="description" name="description" class="form-control" 
                           value="{{ form_data.description or transaction.description or '' }}" maxlength="500">
                </div>

                <!-- Buttons -->
                <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 30px;">
                    <a href="{{ url_for('transactions_list') }}" class="btn btn-outline">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        Update Transaction
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
